title: Tail Studio
description: Tail Studio の開発・生成AIにまつわるノート
url: "https://tail-studio.com"
baseurl: ""
author:
  name: Tail Studio
  bio: 開発・生成AIにまつわるノート。
lang: ja
timezone: Asia/Tokyo

# 記事の「いいね」機能。counterapi.dev の workspace (Public Workspace に設定済み)を使い、
# 全訪問者で共有されるカウントになる。記事が _data/like-counters.yml に未登録の場合は
# localStorage のみのローカル表示にフォールバックする。
# 記事ごとのカウンター名(post-01, post-02, ...)との対応は _data/like-counters.yml で管理する。
# counterapi.dev には新規カウンター作成 API が無いため、post-NN の在庫が尽きたら
# app.counterapi.dev の workspace でまとめて New Counter を作成してから追記する。
#
# workspace を Public にしているため認証トークンは不要(そもそも counterapi.dev は
# スコープを絞ったトークンを発行できず常に Full Access になり、ブラウザから直接
# Authorization ヘッダーを送ると CORS でブロックされるため、この方式にしている)。
likes:
  workspace: "ws-team-1-5136"

# 記事コメント欄(Disqus)。disqus.com でサイト登録して発行される shortname を設定すると
# 記事ページにコメント欄が表示される。空のままなら非表示。
disqus:
  shortname: ""

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Jekyll は YAML フロントマター無しの既存 HTML/JSON はそのまま静的ファイルとして配信する。
# 以下は出力に含めたくないファイル/ディレクトリ。
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .claude
  - .DS_Store
