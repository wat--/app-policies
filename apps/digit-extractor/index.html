<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字抽出ツール — Digit Extractor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f1117;color:#e5e7eb;font-family:-apple-system,'Hiragino Sans',sans-serif;
  padding:20px;max-width:680px;margin:0 auto;}

h1{text-align:center;font-size:15px;color:#93c5fd;margin-bottom:4px;letter-spacing:.05em;}
.subtitle{text-align:center;font-size:11px;color:#4b5563;margin-bottom:18px;}

.config-panel{background:#1a1f2e;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.config-panel h2{font-size:12px;color:#60a5fa;margin-bottom:12px;letter-spacing:.04em;}
.config-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.config-row:last-child{margin-bottom:0;}
.config-row label{font-size:12px;color:#9ca3af;min-width:110px;}
.config-row input[type=number]{
  width:70px;background:#0f1117;border:1px solid #374151;border-radius:6px;
  color:#e5e7eb;font-size:13px;padding:5px 8px;text-align:center;
  -moz-appearance:textfield;}
.config-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.config-row input[type=number]:focus{outline:none;border-color:#60a5fa;}
.config-hint{font-size:10px;color:#4b5563;margin-top:8px;line-height:1.6;}
.pattern-preview{
  display:inline-block;background:#0f1117;border:1px solid #1f2937;
  border-radius:6px;padding:4px 10px;font-family:monospace;font-size:13px;
  color:#34d399;letter-spacing:.1em;margin-top:4px;}

.drop-zone{
  border:2px dashed #374151;border-radius:12px;padding:28px 20px;
  text-align:center;cursor:pointer;margin-bottom:14px;transition:.2s;
  position:relative;}
.drop-zone:hover,.drop-zone.drag-over{border-color:#60a5fa;background:#1a1f2e;}
.drop-zone input[type=file]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-zone .icon{font-size:32px;margin-bottom:8px;}
.drop-zone p{color:#6b7280;font-size:12px;line-height:1.9;}

#previewWrap{display:none;margin-bottom:14px;border-radius:10px;overflow:hidden;
  border:1px solid #1f2937;background:#080c14;text-align:center;position:relative;}
#previewImg{max-width:100%;max-height:300px;display:block;margin:0 auto;}
.preview-label{font-size:10px;color:#4b5563;padding:5px 10px;background:#080c14;}
.clear-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);
  border:1px solid #374151;color:#9ca3af;border-radius:6px;padding:3px 8px;
  font-size:11px;cursor:pointer;}
.clear-btn:hover{background:#374151;color:#e5e7eb;}

.action-row{display:flex;gap:10px;margin-bottom:14px;}
#extractBtn{
  flex:1;background:#2563eb;border:none;border-radius:10px;color:#fff;
  font-size:14px;font-weight:700;padding:13px;cursor:pointer;
  letter-spacing:.04em;transition:.15s;}
#extractBtn:hover:not(:disabled){background:#1d4ed8;}
#extractBtn:disabled{background:#1e2535;color:#374151;cursor:not-allowed;}

#statusBox{display:none;background:#1a1f2e;border-radius:10px;
  padding:12px 16px;margin-bottom:14px;}
.status-main{font-size:12px;color:#60a5fa;margin-bottom:6px;}
.status-rot{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.rot-chip{
  font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;
  border:1px solid #1f2937;color:#4b5563;background:#0f1117;}
.rot-chip.active{border-color:#3b82f6;color:#60a5fa;background:#1e3a5f;}
.rot-chip.ok{border-color:#065f46;color:#34d399;background:#064e3b;}
.rot-chip.best{border-color:#b45309;color:#fbbf24;background:#1c1209;}
#progressBar{height:5px;background:#1e2535;border-radius:4px;overflow:hidden;}
#progressFill{height:100%;background:#3b82f6;width:0%;transition:width .15s;border-radius:4px;}

#resultSection{display:none;}
.result-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;}
.result-header h2{font-size:13px;color:#93c5fd;}
.result-meta{display:flex;align-items:center;gap:8px;}
.result-count{font-size:11px;color:#4b5563;}
.rot-badge{font-size:10px;font-family:monospace;background:#1c1209;
  border:1px solid #b45309;color:#fbbf24;border-radius:4px;padding:2px 7px;}
.copy-all-btn{
  background:#064e3b;border:1px solid #065f46;color:#34d399;
  border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;
  cursor:pointer;transition:.15s;}
.copy-all-btn:hover{background:#065f46;}

#resultList{list-style:none;}
#resultList li{
  display:flex;align-items:center;gap:10px;
  background:#1a1f2e;border-radius:8px;padding:9px 12px;
  margin-bottom:6px;transition:.15s;}
#resultList li.copied{background:#064e3b;}
.row-num{font-size:11px;color:#4b5563;font-family:monospace;
  min-width:22px;text-align:right;flex-shrink:0;}
.num-text{font-family:monospace;font-size:15px;font-weight:700;
  color:#e5e7eb;letter-spacing:.08em;flex:1;word-break:break-all;}
.copy-btn{
  flex-shrink:0;background:#1e3a5f;border:1px solid #2563eb;color:#93c5fd;
  border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;
  cursor:pointer;transition:.15s;white-space:nowrap;}
.copy-btn:hover{background:#2563eb;color:#fff;}
.copy-btn.ok{background:#064e3b;border-color:#065f46;color:#34d399;}

.empty-msg{text-align:center;font-size:12px;color:#6b7280;padding:20px;
  background:#1a1f2e;border-radius:10px;line-height:1.8;}

#rawToggle{margin-top:14px;font-size:11px;color:#374151;cursor:pointer;
  text-align:center;user-select:none;}
#rawToggle:hover{color:#6b7280;}
#rawBox{display:none;margin-top:8px;background:#080c14;border:1px solid #1f2937;
  border-radius:8px;padding:12px;font-family:monospace;font-size:10px;
  color:#4b5563;white-space:pre-wrap;max-height:200px;overflow-y:auto;line-height:1.6;}
</style>
</head>
<body>

<h1>数字抽出ツール</h1>
<p class="subtitle">写真からシリアルナンバーなどの数字列を一括OCR抽出</p>

<div class="config-panel">
  <h2>抽出パターン設定</h2>
  <div class="config-row">
    <label>グループ数</label>
    <input type="number" id="groupCount" value="4" min="1" max="8">
    <span style="font-size:12px;color:#6b7280;">グループ</span>
  </div>
  <div class="config-row">
    <label>1グループの桁数</label>
    <input type="number" id="groupDigits" value="4" min="1" max="10">
    <span style="font-size:12px;color:#6b7280;">桁</span>
  </div>
  <div style="margin-top:10px;">
    <span style="font-size:11px;color:#6b7280;">抽出パターン：</span>
    <span class="pattern-preview" id="patternPreview">XXXX-XXXX-XXXX-XXXX</span>
    <span style="font-size:11px;color:#4b5563;margin-left:8px;">（計 <span id="totalDigits">16</span> 桁）</span>
  </div>
  <p class="config-hint">※ 向きは自動判定します。ハイフン・スペース等の区切りに柔軟対応。結果はハイフンなしで表示。</p>
</div>

<!-- capture属性なし → カメラ・フォトライブラリ両対応 -->
<div class="drop-zone" id="dropZone">
  <input type="file" id="fileInput" accept="image/*">
  <div class="icon">🖼️</div>
  <p>写真をドロップ、またはタップして選択</p>
  <p style="font-size:11px;color:#4b5563;margin-top:4px;">撮影済み写真・カメラ直撮り両対応 / JPEG・PNG・HEIC</p>
</div>

<div id="previewWrap">
  <img id="previewImg" alt="プレビュー">
  <p class="preview-label" id="previewLabel"></p>
  <button class="clear-btn" id="clearBtn">✕ 削除</button>
</div>

<div class="action-row">
  <button id="extractBtn" disabled>🔍 OCR 実行して数字を抽出</button>
</div>

<div id="statusBox">
  <div class="status-main" id="statusText">準備中...</div>
  <div class="status-rot" id="rotChips">
    <span class="rot-chip" id="chip0">0°</span>
    <span class="rot-chip" id="chip90">90°</span>
    <span class="rot-chip" id="chip180">180°</span>
    <span class="rot-chip" id="chip270">270°</span>
  </div>
  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<div id="resultSection">
  <div class="result-header">
    <h2>抽出結果</h2>
    <div class="result-meta">
      <span class="result-count" id="resultCount"></span>
      <span class="rot-badge" id="rotBadge" style="display:none"></span>
      <button class="copy-all-btn" id="copyAllBtn">全てコピー</button>
    </div>
  </div>
  <ul id="resultList"></ul>
  <div id="rawToggle">▼ OCR 生テキストを表示</div>
  <div id="rawBox"></div>
</div>

<script src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js"></script>
<script>
const groupCountEl  = document.getElementById('groupCount');
const groupDigitsEl = document.getElementById('groupDigits');
const patternPreview= document.getElementById('patternPreview');
const totalDigitsEl = document.getElementById('totalDigits');
const dropZone      = document.getElementById('dropZone');
const fileInput     = document.getElementById('fileInput');
const previewWrap   = document.getElementById('previewWrap');
const previewImg    = document.getElementById('previewImg');
const previewLabel  = document.getElementById('previewLabel');
const clearBtn      = document.getElementById('clearBtn');
const extractBtn    = document.getElementById('extractBtn');
const statusBox     = document.getElementById('statusBox');
const statusText    = document.getElementById('statusText');
const progressFill  = document.getElementById('progressFill');
const resultSection = document.getElementById('resultSection');
const resultList    = document.getElementById('resultList');
const resultCount   = document.getElementById('resultCount');
const rotBadge      = document.getElementById('rotBadge');
const copyAllBtn    = document.getElementById('copyAllBtn');
const rawToggle     = document.getElementById('rawToggle');
const rawBox        = document.getElementById('rawBox');
const chips         = [0, 90, 180, 270].map(r => document.getElementById('chip' + r));

let currentFile = null;

// ── パターンプレビュー ──
function updatePattern() {
  const g = Math.max(1, parseInt(groupCountEl.value) || 1);
  const d = Math.max(1, parseInt(groupDigitsEl.value) || 1);
  patternPreview.textContent = Array(g).fill('X'.repeat(d)).join('-');
  totalDigitsEl.textContent = g * d;
}
groupCountEl.addEventListener('input', updatePattern);
groupDigitsEl.addEventListener('input', updatePattern);

// ── ファイル選択 ──
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(f) {
  currentFile = f;
  previewImg.src = URL.createObjectURL(f);
  previewLabel.textContent = `${f.name}  (${(f.size/1024).toFixed(0)} KB)`;
  previewWrap.style.display = 'block';
  dropZone.style.display = 'none';
  extractBtn.disabled = false;
  resultSection.style.display = 'none';
  statusBox.style.display = 'none';
}

clearBtn.addEventListener('click', () => {
  currentFile = null;
  fileInput.value = '';
  previewImg.src = '';
  previewWrap.style.display = 'none';
  dropZone.style.display = 'block';
  extractBtn.disabled = true;
  resultSection.style.display = 'none';
  statusBox.style.display = 'none';
});

// ── 画像をキャンバスに回転描画（最大1500px、白背景） ──
const MAX_DIM = 1500;

function makeRotatedCanvas(img, deg) {
  const rad = deg * Math.PI / 180;
  const sin = Math.abs(Math.sin(rad));
  const cos = Math.abs(Math.cos(rad));

  const ow = img.naturalWidth;
  const oh = img.naturalHeight;
  const scale = Math.min(1, MAX_DIM / Math.max(ow, oh));
  const sw = Math.round(ow * scale);
  const sh = Math.round(oh * scale);

  const cw = Math.round(sw * cos + sh * sin);
  const ch = Math.round(sw * sin + sh * cos);

  const canvas = document.createElement('canvas');
  canvas.width  = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cw, ch);
  ctx.save();
  ctx.translate(cw / 2, ch / 2);
  ctx.rotate(rad);
  ctx.drawImage(img, -sw/2, -sh/2, sw, sh);
  ctx.restore();
  return canvas;
}

// ── OCR結果から行ごとに数字を抽出（bbox Y順） ──
function extractNums(ocrResult, pattern, totalLen) {
  const lines = (ocrResult.data.lines || [])
    .filter(l => l.text.trim().length > 0)
    .sort((a, b) => {
      const dy = a.bbox.y0 - b.bbox.y0;
      return Math.abs(dy) < 15 ? a.bbox.x0 - b.bbox.x0 : dy;
    });

  const seen = new Set();
  const nums = [];
  for (const line of lines) {
    const matches = line.text.match(pattern) || [];
    for (const m of matches) {
      const clean = m.replace(/\D/g, '');
      if (clean.length === totalLen && !seen.has(clean)) {
        seen.add(clean);
        nums.push(clean);
      }
    }
  }
  return nums;
}

// ── メイン：4方向試行 ──
extractBtn.addEventListener('click', async () => {
  if (!currentFile) return;

  const groups   = Math.max(1, parseInt(groupCountEl.value) || 1);
  const digits   = Math.max(1, parseInt(groupDigitsEl.value) || 1);
  const totalLen = groups * digits;
  const pattern  = new RegExp(
    Array(groups).fill(`\\d{${digits}}`).join('[^\\d]{0,3}'), 'g'
  );

  extractBtn.disabled = true;
  resultSection.style.display = 'none';
  statusBox.style.display = 'block';
  progressFill.style.width = '0%';
  chips.forEach(c => { c.className = 'rot-chip'; });
  statusText.textContent = '画像を読み込み中...';

  // ファイルから Image を生成（EXIF 適用前の生ピクセルで 4 方向を試す）
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = URL.createObjectURL(currentFile);
  });

  const rotations = [0, 90, 180, 270];
  let best = { nums: [], rawText: '', rotation: 0 };

  try {
    for (let ri = 0; ri < rotations.length; ri++) {
      const rot = rotations[ri];
      const chip = chips[ri];
      chip.className = 'rot-chip active';
      statusText.textContent = `向きを確認中... ${rot}° (${ri+1}/${rotations.length})`;
      progressFill.style.width = '0%';

      const canvas = makeRotatedCanvas(img, rot);

      const result = await Tesseract.recognize(canvas, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            progressFill.style.width = Math.round(m.progress * 100) + '%';
          }
        }
      });

      const nums = extractNums(result, pattern, totalLen);
      chip.className = nums.length > 0 ? 'rot-chip ok' : 'rot-chip';

      if (nums.length > best.nums.length) {
        best = { nums, rawText: result.data.text, rotation: rot };
      }

      // 3件以上見つかればこの向きが正解と判断して早期終了
      if (nums.length >= 3) {
        chip.className = 'rot-chip best';
        break;
      }
    }

    // 最多件数の向きのチップをハイライト（早期終了しなかった場合）
    const bestChipIdx = rotations.indexOf(best.rotation);
    if (chips[bestChipIdx].className !== 'rot-chip best') {
      chips[bestChipIdx].className = 'rot-chip best';
    }

    rawBox.textContent = best.rawText;
    showResults(best.nums, best.rotation);
  } catch (err) {
    statusText.textContent = 'エラー: ' + err.message;
  } finally {
    extractBtn.disabled = false;
  }
});

// ── 結果表示 ──
function showResults(nums, rotation) {
  statusBox.style.display = 'none';
  resultSection.style.display = 'block';
  resultList.innerHTML = '';

  rotBadge.textContent = `${rotation}° で認識`;
  rotBadge.style.display = '';

  if (nums.length === 0) {
    resultCount.textContent = '';
    resultList.innerHTML = '<div class="empty-msg">一致する数字列が見つかりませんでした。<br>パターン設定を確認するか「OCR 生テキスト」で内容を確認してください。</div>';
    copyAllBtn.style.display = 'none';
    return;
  }

  resultCount.textContent = `${nums.length} 件`;
  copyAllBtn.style.display = '';

  nums.forEach((num, i) => {
    const li   = document.createElement('li');
    const idx  = document.createElement('span');
    idx.className = 'row-num';
    idx.textContent = i + 1;

    const span = document.createElement('span');
    span.className = 'num-text';
    span.textContent = num;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'コピー';
    btn.addEventListener('click', () => copyText(num, btn, li));

    li.appendChild(idx);
    li.appendChild(span);
    li.appendChild(btn);
    resultList.appendChild(li);
  });
}

// ── クリップボードコピー ──
async function copyText(text, btn, li) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = Object.assign(document.createElement('textarea'),
      { value: text, style: 'position:fixed;opacity:0' });
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.textContent = '✓ コピー済';
  btn.classList.add('ok');
  li.classList.add('copied');
  setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('ok'); li.classList.remove('copied'); }, 2000);
}

copyAllBtn.addEventListener('click', async () => {
  const text = [...resultList.querySelectorAll('.num-text')].map(s => s.textContent).join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = Object.assign(document.createElement('textarea'),
      { value: text, style: 'position:fixed;opacity:0' });
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  copyAllBtn.textContent = '✓ コピー済';
  setTimeout(() => { copyAllBtn.textContent = '全てコピー'; }, 2000);
});

rawToggle.addEventListener('click', () => {
  const open = rawBox.style.display === 'block';
  rawBox.style.display = open ? 'none' : 'block';
  rawToggle.textContent = open ? '▼ OCR 生テキストを表示' : '▲ OCR 生テキストを隠す';
});
</script>
</body>
</html>
